name: Secrets and Vars

on: workflow_dispatch

jobs:
  use:
    runs-on: ubuntu-latest
    steps:
      - env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "APP_ENV = ${{ vars.APP_ENV }}"
          echo "DB_PASSWORD = $DB_PASSWORD"
          echo "Password length = ${#DB_PASSWORD}"
