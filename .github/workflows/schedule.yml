name: Scheduled

on:
  schedule:
    - cron: "*/1 * * * *" # every 1 minutes (UTC)
    - cron: "30 9 * * 1-5" # 09:30, Monday to Friday
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC time now: $(date -u)"
